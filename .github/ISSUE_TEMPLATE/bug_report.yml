name: 可复现的问题
description: 报告下载、资料整理、知识功能或交付中的实际问题。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        请提供最小复现。不要上传 Cookie、口令、API 密钥、数据库或客户素材。
        涉及安全漏洞时，请先查看 SECURITY.md，使用私密报告入口；入口不可用时仅请求私密联系方式，不公开攻击细节。
  - type: input
    id: version
    attributes:
      label: 当前版本
      description: git rev-parse HEAD 的结果，或实际发布版本。
      placeholder: 完整 commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境与部署
      description: 系统、浏览器、Docker / 本地开发、依赖版本、是否设置口令。不要填写口令值。
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 受影响流程
      options:
        - 链接解析或下载队列
        - 收藏、播放或媒体文件
        - 字幕搜索、标记或复习卡
        - 项目、授权或 ZIP 交付
        - 工作流、分析或操作记录
        - 部署、升级或备份
        - 其他
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现步骤
      description: 从什么状态开始、输入什么、按什么顺序操作。来源链接仅在确认可以公开时提供，否则用脱敏的自有/公开授权复现素材。
      placeholder: |
        1. 使用空测试实例...
        2. 添加自有或公开授权素材...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与脱敏证据
      description: 包含错误信息、状态码或截图；说明是否稳定复现、仅某个来源失效、是否在当前版本首次出现。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 公开内容核对
      options:
        - label: 我已移除密钥、口令、Cookie、客户资料与不可公开素材，且这不是需要私密披露的漏洞细节。
          required: true
