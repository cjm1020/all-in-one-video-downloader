name: all-in-one-video-downloader

x-backend: &backend
  image: all-in-one-video-downloader-backend:local
  build:
    context: ./backend
    args:
      PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.11-slim}
  init: true
  restart: unless-stopped
  volumes:
    - library:/data
    - ./cookies:/cookies:ro
  environment: &backend-env
    DATA_DIR: /data
    PYTHONUTF8: "1"
    COOKIE_FILE: ${COOKIE_FILE:-}
    MAX_STORAGE_GB: ${MAX_STORAGE_GB:-10}
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  api:
    <<: *backend
    environment:
      <<: *backend-env
      ACCESS_TOKEN: ${ACCESS_TOKEN:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
    mem_limit: 512m
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 3
      start_period: 20s

  worker:
    <<: *backend
    command: [python, -m, app.worker]
    mem_limit: 1536m
    stop_grace_period: 20s
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -m, app.healthcheck]
      interval: 15s
      timeout: 8s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ./frontend
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.28-alpine}
    image: all-in-one-video-downloader-web:local
    restart: unless-stopped
    ports:
      - "${HOST_BIND:-127.0.0.1}:${WEB_PORT:-8090}:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 8s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  library:
